            <div class="premium-contact-form-wrap">
                <form action="mail.php" method="post">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="fname">الاسم الكامل</label>
                            <input type="text" id="fname" name="name" placeholder="اسمك" required>

                        <div class="col-md-6">
                            <label for="email">البريد الإلكتروني</label>
                            <input type="email" id="email" name="email" placeholder="email@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone">رقم الجوال</label>
                            <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx">
                        </div>
                        <div class="col-md-6">
                            <label for="service">نوع الخدمة</label>
                            <select id="service" name="service">
                                <option value="web">تطوير الويب</option>
                                <option value="systems">الأنظمة</option>
                                <option value="apps">التطبيقات</option>
                                <option value="other">أخرى</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="message">رسالتك</label>
                            <textarea id="message" name="message" placeholder="صف مشروعك أو استفسارك..." required></textarea>

                        <div class="col-12">
